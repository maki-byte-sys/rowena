<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fff1d6, #ffd1d1);
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 900px;
  width: 100%;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}

.info {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  margin: 0 0 15px;
  font-size: 36px;
  color: #b63a3a;
}

p {
  font-size: 16px;
  color: #444;
  margin: 10px 0;
}

.contact-card {
  background: #fff7e6;
  padding: 20px;
  border-radius: 12px;
  margin-top: 15px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
}

.btn {
  display: inline-block;
  margin-top: 25px;
  background: linear-gradient(135deg, #b63a3a, #ff6f61);
  color: white;
  padding: 12px 28px;
  text-decoration: none;
  border-radius: 30px;
  font-weight: 600;
  width: fit-content;
  transition: all 0.3s ease;
  box-shadow: 0 8px 20px rgba(182, 58, 58, 0.4);
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(182, 58, 58, 0.6);
}

.map {
  width: 100%;
  height: 100%;
  min-height: 350px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>
<body>  <div class="container">
    <div class="info">
      <h1>Contact Us</h1>
      <div class="contact-card">
        <p><strong>Email:</strong> Rowena@email.com</p>
        <p><strong>Phone:</strong> 0912-345-6789</p>
        <p><strong>Location:</strong> Binalatongan Community College</p>
      </div><a href="index.html" class="btn">← Back to Main Page</a>
</div>

<div class="map">
  <iframe 
    src="https://www.google.com/maps?q=Binalatongan%20Community%20College&output=embed"
    allowfullscreen=""
    loading="lazy">
  </iframe>
</div>

  </div></body>
</html>
